    queries:
      - "journalist"
      - "reporter"
      - "skribent"
      - "redaktör"
      - "kommunikatör"
      - "pressekreterare"
      - "press officer"
      - "communications officer"
      - "content writer"
      - "editor"
      - "researcher"
      - "research assistant"
      - "communications NGO"
      - "kultur kommunikation"

  adjacent:
