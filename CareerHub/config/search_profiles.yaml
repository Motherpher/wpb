    weight: 0.9
    queries:
      - "communications coordinator"
      - "content specialist"
      - "copywriter"
      - "editorial producer"
      - "project coordinator"
      - "projektkoordinator"
      - "research coordinator"
      - "community manager"
      - "media monitoring"
      - "communications assistant"
      - "translator"
      - "localisation"

  bridge:
    description: "Flexible / extra-income roles with a lower entry barrier or reduced scope."
    weight: 0.75
