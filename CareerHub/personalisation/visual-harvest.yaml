    background: "full-bleed orange/sage field with solar-yellow focal circle and organic botanical mass"
    typography: "oversized editorial display type"
    room_cards: "offset print-panel composition; asymmetrical vertical alignment; hard ink rules/shadows"
  portfolio:
    background: "bright paper interrupted by saturated fields and botanical/double-exposure abstractions"
    hero: "poster-scale title with layered colour bars/circle and collage depth"
    sections: "variable colour panels, strong numbering, dense selected-work list with colour-reactive hover"
  careerhub:
