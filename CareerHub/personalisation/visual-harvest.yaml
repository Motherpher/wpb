  rationale: "The reference material is not a beige editorial system with occasional accents. Saturated colour fields are part of the composition itself. The profile home therefore uses orange/sage/yellow as structural background fields, the portfolio alternates bright paper with collage-colour scenes, and CareerHub uses the same identity with stronger functional restraint."

