observed:
  typography_character: "editorial and poster-like; typography should act as a major compositional object, not merely interface text"
  grid_layout_rhythm: "asymmetric editorial composition; deliberate imbalance; large colour planes; overlapping or offset focal elements; variable section widths"
  whitespace_density: "variable by section; generous negative space alternates with visually dense collage fields"
  geometry: "hard-edged editorial panels and bars combined with circles, botanical silhouettes and irregular organic masses"
  hierarchy: "one dominant visual field per scene; oversized display type; strong image/colour focal point; small utility typography as contrast"
  colour_logic: "orange/coral and solar yellow are structural fields, not occasional button colours; warm white and sage create breathing space; electric blue and coral-red provide high-energy counterpoints; charcoal anchors type and rules"
  card_surface_behaviour: "cards should often read as print panels, clipped spreads or poster blocks rather than generic dashboard containers"
  iconography: "minimal; graphic marks, numbering, lines, collage fields and typography carry identity"
  data_visualisation_language: "functional and restrained when needed; should inherit print/editorial rules rather than default SaaS dashboard styling"
  imagery_language: "editorial collage; botanical layering; silhouette/double exposure; fragmented portrait logic; saturated cut-paper and print-like colour relationships"
  motion_character: "subtle physical movement only: offset, slide, lift and small collage shifts; no glossy product-animation language"

