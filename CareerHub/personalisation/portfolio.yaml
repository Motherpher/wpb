schema_version: "1.0"
eyebrow: "Writer · reporter · researcher"
headline: "Writing across borders, systems and lived experience."
intro: "Weronika Pérez Borjas is a writer and reporter whose published work moves across cultural criticism, interviews, social observation and long-form reportage. A recurring strength is cross-cultural translation: reporting that begins with people encountering institutions, borders, labour systems, law and public life."

sections:
  - label: "Long-form reportage"
    description: "Migration, labour, healthcare, reproductive rights, gender, borders and public institutions."
  - label: "Culture & interviews"
    description: "Music, art, subculture, urban life and conversations with cultural actors."
  - label: "Research & criticism"
    description: "Work rooted in fashion studies, visual culture, the body, representation and social categories."
  - label: "Transnational reporting"
    description: "Poland and Sweden form one major axis; Cuba and wider cross-border contexts form another."

