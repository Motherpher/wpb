schema_version: "1.0"
profile_id: weronika-perez-borjas
display_name: "Weronika Pérez Borjas"
status: active

profile_core:
  path: profile/profile.yaml
  permissions: profile/permissions/profile_policy.yaml

rooms:
  writer_journalism:
    manifest: WriterRoom/writerroom.yaml
    control_room: WriterRoom/CONTROL_ROOM.md
  career:
    manifest: CareerHub/careerhub.yaml
    control_room: CareerHub/CONTROL_ROOM.md

bridges:
