name: Validate CareerHub

on:
  push:
    paths:
      - "CareerHub/**"
      - ".github/workflows/careerhub-*.yml"
      - ".github/ISSUE_TEMPLATE/careerhub-*.yml"
  pull_request:
    paths:
      - "CareerHub/**"
      - ".github/workflows/careerhub-*.yml"
      - ".github/ISSUE_TEMPLATE/careerhub-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r CareerHub/requirements.txt

      - name: Compile Python
        run: |
          find CareerHub/src CareerHub/scripts -name '*.py' -print0 | xargs -0 -n1 python -m py_compile

      - name: Validate YAML and JSON
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path

          yaml_files = [
              Path("CareerHub/profile/candidate.yaml"),
              Path("CareerHub/config/sources.yaml"),
              Path("CareerHub/config/search_profiles.yaml"),
              Path(".github/ISSUE_TEMPLATE/careerhub-choose-job.yml"),
              Path(".github/ISSUE_TEMPLATE/careerhub-update-status.yml"),
          ]
          for p in yaml_files:
              yaml.safe_load(p.read_text(encoding="utf-8"))
              print("YAML OK", p)

          json_files = [
              Path("CareerHub/hrdm/hrdm_result.schema.json"),
              Path("CareerHub/data/latest_jobs.json"),
              Path("CareerHub/data/job_vault.json"),
              Path("CareerHub/data/applications.json"),
          ]
          for p in json_files:
              json.loads(p.read_text(encoding="utf-8"))
              print("JSON OK", p)
          PY

      - name: CLI smoke test
        run: python CareerHub/scripts/careerhub.py --help

      - name: Choose-job parser smoke test
        run: |
          cat > /tmp/careerhub-event.json <<'JSON'
          {
            "issue": {
              "number": 99,
              "title": "[CareerHub Job] Example",
              "user": {"login": "tester"},
              "body": "### Job URL\nhttps://example.invalid/job\n\n### Role\nCommunications coordinator\n\n### Employer\nExample Org\n\n### Lane\nadjacent — transferable/adjacent role\n\n### Priority 1–5\n4 — High\n\n### Deadline\n2026-10-10\n\n### Job text (optional)\nCommunications coordinator. Part time. Research and writing."
            }
          }
          JSON
          python CareerHub/scripts/issue_request.py --event /tmp/careerhub-event.json --out /tmp/careerhub-request
          test "$(cat /tmp/careerhub-request/lane.txt)" = "adjacent"
          test "$(cat /tmp/careerhub-request/priority.txt)" = "4"
          test "$(cat /tmp/careerhub-request/deadline.txt)" = "2026-10-10"
          grep -q "Communications coordinator" /tmp/careerhub-request/job_text.txt

      - name: Status-update parser smoke test
        run: |
          cat > /tmp/careerhub-update-event.json <<'JSON'
          {
            "issue": {
              "number": 101,
              "title": "[CareerHub Update] #99 — Applied",
              "body": "### CareerHub case issue\n99\n\n### New status\napplied\n\n### Date\n2026-09-23\n\n### Next action (optional)\nFollow up\n\n### Next action date (optional)\n2026-10-01"
            }
          }
          JSON
          python CareerHub/scripts/update_request.py --event /tmp/careerhub-update-event.json --out /tmp/careerhub-update
          test "$(cat /tmp/careerhub-update/case_issue_number.txt)" = "99"
          test "$(cat /tmp/careerhub-update/status.txt)" = "applied"

      - name: Matching-quality regression test
        run: |
          PYTHONPATH=CareerHub/src python - <<'PY'
          import yaml
          from careerhub.models import Job
          from careerhub.matching import rank_jobs

          profile=yaml.safe_load(open("CareerHub/profile/candidate.yaml", encoding="utf-8"))
          search=yaml.safe_load(open("CareerHub/config/search_profiles.yaml", encoding="utf-8"))
          core=search["lanes"]["core"]
          bridge=search["lanes"]["bridge"]

          good=Job(source="test", title="Communications Officer", company="NGO", location="Stockholm", description="Writing, media relations and stakeholder communication.")
          bad=Job(source="test", title="Backend Software Engineer", company="TechCo", location="Remote", description="Build APIs and backend systems. Communication skills valued.")
          us_only=Job(source="test", title="Content Writer", company="USCo", location="United States", work_mode="remote", description="Remote - United States only. Content writing.")
          bridge_good=Job(source="test", title="Administratör deltid", company="Local", location="Stockholm", description="Deltid administration and reception.")

          core_ranked=rank_jobs([good,bad,us_only], "core", core, profile, search["defaults"])
          titles=[j.title for j in core_ranked]
          assert "Communications Officer" in titles, titles
          assert "Backend Software Engineer" not in titles, titles
          assert "Content Writer" not in titles, titles

          bridge_ranked=rank_jobs([bridge_good], "bridge", bridge, profile, search["defaults"])
          assert bridge_ranked and bridge_ranked[0].title == "Administratör deltid"
          print("Matching-quality regression OK")
          PY

      - name: State/vault regression test
        run: |
          PYTHONPATH=CareerHub/src python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from careerhub.models import Job
          from careerhub.state import merge_job_vault, choose_case, update_case, load_cases

          with TemporaryDirectory() as td:
              root=Path(td)
              vault_path=root/"vault.json"
              cases_path=root/"cases.json"
              job=Job(source="test", title="Reporter", company="Example", location="Stockholm", deadline="2026-10-15", url="https://example.invalid/reporter", lane="core")
              vault=merge_job_vault(vault_path,[job])
              assert vault["total_jobs_ever_seen"] == 1
              case=choose_case(cases_path,job,12,"https://github.com/example/issues/12",5)
              assert case["priority"] == 5 and case["status"] == "ready"
              case=update_case(cases_path,12,"applied")
              assert case["status"] == "applied"
              assert load_cases(cases_path)["cases"][0]["history"]
          print("State/vault regression OK")
          PY

      - name: Offline drill + DOCX smoke test
        run: |
          python CareerHub/scripts/careerhub.py drill             --url "https://example.invalid/job"             --text "Communications coordinator. Part time. Research, writing, stakeholder communication and project coordination."             --title "Communications coordinator"             --company "Example Org"             --deadline "2026-10-10"             --lane adjacent             --out /tmp/careerhub-smoke
          test -f /tmp/careerhub-smoke/job.json
          test -f /tmp/careerhub-smoke/HRDM_input_packet.json
          test -f /tmp/careerhub-smoke/HRDM_result.json
          ls /tmp/careerhub-smoke/*.docx >/dev/null
