name: CareerHub · Validate Profile and Site

on:
  push:
    paths:
      - "CareerHub/**"
      - ".github/workflows/careerhub-*.yml"
  pull_request:
    paths:
      - "CareerHub/**"
      - ".github/workflows/careerhub-*.yml"

permissions:
  contents: read

jobs:
  profile-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate profile against CareerHubZero
        uses: Motherpher/CareerHubZero@main
        with:
          manifest: CareerHub/careerhub.yaml
          command: validate

  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: CareerHub/site/package-lock.json
      - name: Install dependencies
        working-directory: CareerHub/site
        run: npm install
      - name: Build personalised CareerHub
        working-directory: CareerHub/site
        run: npm run build
