name: Validate CareerHub

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CareerHub/**"
      - "WriterRoom/portfolio/**"
      - "harvest/output/**"
      - ".github/workflows/careerhub-*.yml"
  push:
    branches: [main]
    paths:
      - "CareerHub/**"
      - "WriterRoom/portfolio/**"
      - "harvest/output/**"
      - ".github/workflows/careerhub-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install canonical CareerHub motor
        run: |
          pip install -r .careerhub-zero/requirements.txt
          pip install "jsonschema>=4,<5"
      - name: Assert profile-only cutover boundary
        run: |
          test -f CareerHub/careerhub.yaml
          test ! -d CareerHub/src
          test ! -d CareerHub/scripts
          test ! -d CareerHub/hrdm
          test ! -f CareerHub/requirements.txt
          test ! -f CareerHub/instance.yaml
          test ! -f CareerHub/stack.lock.yaml
      - name: Validate personalised design contracts against CareerHubZero
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator

          root = Path('CareerHub/personalisation')
          central = Path('.careerhub-zero/schemas')
          contracts = [
              ('hub.profile.yaml', 'personalised-hub.schema.json', 'yaml'),
              ('theme.tokens.json', 'theme-tokens.schema.json', 'json'),
              ('derivation.yaml', 'profile-derivation.schema.json', 'yaml'),
              ('profile.shell.yaml', 'profile-shell.schema.json', 'yaml'),
          ]

          for instance_name, schema_name, format_name in contracts:
              instance_path = root / instance_name
              schema_path = central / schema_name
              raw = instance_path.read_text(encoding='utf-8')
              instance = json.loads(raw) if format_name == 'json' else yaml.safe_load(raw)
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              validator = Draft202012Validator(schema)
              errors = sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path))
              if errors:
                  lines = []
                  for error in errors:
                      where = '.'.join(str(part) for part in error.absolute_path) or '<root>'
                      lines.append(f'{instance_name}:{where}: {error.message}')
                  raise SystemExit('Personalisation schema validation failed:\n' + '\n'.join(lines))
              print('SCHEMA OK', instance_name, 'against', schema_name)
          PY
      - name: Validate complete portfolio partition
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import yaml

          root = Path('CareerHub/personalisation')
          profile = yaml.safe_load((root / 'portfolio.yaml').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'portfolio-catalog.json').read_text(encoding='utf-8'))
          works = catalog.get('works', [])
          ids = [work['id'] for work in works]
          if len(ids) != catalog.get('work_count'):
              raise SystemExit(f"Catalog count mismatch: declared {catalog.get('work_count')} actual {len(ids)}")
          duplicate_catalog_ids = [work_id for work_id, count in Counter(ids).items() if count > 1]
          if duplicate_catalog_ids:
              raise SystemExit('Duplicate catalog IDs: ' + ', '.join(duplicate_catalog_ids))

          assignments = []
          areas = {}
          for section in profile.get('sections', []):
              section_ids = section.get('filter', {}).get('ids', [])
              areas[section['slug']] = section_ids
              assignments.extend(section_ids)

          duplicate_assignments = [work_id for work_id, count in Counter(assignments).items() if count > 1]
          missing = sorted(set(ids) - set(assignments))
          unknown = sorted(set(assignments) - set(ids))
          mismatched_primary = sorted(
              work['id'] for work in works
              if work.get('primary_area') not in areas or work['id'] not in areas[work.get('primary_area')]
          )
          if duplicate_assignments or missing or unknown or mismatched_primary:
              raise SystemExit(
                  'Portfolio partition invalid\n'
                  f'duplicate assignments={duplicate_assignments}\n'
                  f'missing={missing}\n'
                  f'unknown={unknown}\n'
                  f'primary_area mismatches={mismatched_primary}'
              )
          if profile.get('archive', {}).get('count') != len(ids):
              raise SystemExit('portfolio.yaml archive.count does not equal catalog work count')
          if profile.get('archive', {}).get('source') != 'portfolio-catalog.json':
              raise SystemExit('portfolio.yaml must use portfolio-catalog.json as the public archive source')

          print('PORTFOLIO PARTITION OK', {slug: len(items) for slug, items in areas.items()}, 'total=', len(ids))
          PY
      - name: Validate profile contract against central motor
        env:
          PYTHONPATH: .careerhub-zero/src
        run: python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml validate
      - name: Render profile surfaces with central motor
        env:
          PYTHONPATH: .careerhub-zero/src
        run: python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml render
      - name: Verify manifest-owned profile and state are preserved
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('CareerHub')
          manifest = yaml.safe_load((root / 'careerhub.yaml').read_text(encoding='utf-8'))
          required = [manifest['profile']['path'], manifest['search']['path'], *manifest['state'].values()]
          required += ['CONTROL_ROOM.md', 'APPLICATIONS.md', 'JOB_VAULT.md']
          missing = [rel for rel in required if not (root / rel).exists()]
          if missing:
              raise SystemExit('Missing preserved profile/state paths: ' + ', '.join(missing))
          print('Preserved profile/state paths OK:', ', '.join(required))
          PY
      - name: Reproduce central sync and verify protected profile visual layer
        run: |
          python .careerhub-zero/scripts/sync_web_shell.py CareerHub
          test -f CareerHub/site/personal/profile.css
          test -f CareerHub/site/personal/weronika.css
          test -f CareerHub/site/personal/weronika-v3.css
          test -f CareerHub/site/personal/weronika-expression.css
          grep -F "import '../personal/profile.css';" CareerHub/site/app/layout.tsx
          grep -F "@import './weronika.css';" CareerHub/site/personal/profile.css
          grep -F "@import './weronika-v3.css';" CareerHub/site/personal/profile.css
          grep -F "@import './weronika-expression.css';" CareerHub/site/personal/profile.css
      - name: Build personalised site
        working-directory: CareerHub/site
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
