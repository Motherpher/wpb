name: Validate CareerHub

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CareerHub/**"
      - ".github/scripts/apply_weronika_visual_override.py"
      - ".github/workflows/careerhub-*.yml"
  push:
    branches: [main]
    paths:
      - "CareerHub/**"
      - ".github/scripts/apply_weronika_visual_override.py"
      - ".github/workflows/careerhub-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install canonical CareerHub motor
        run: |
          pip install -r .careerhub-zero/requirements.txt
          pip install "jsonschema>=4,<5"
      - name: Assert profile-only cutover boundary
        run: |
          test -f CareerHub/careerhub.yaml
          test ! -d CareerHub/src
          test ! -d CareerHub/scripts
          test ! -d CareerHub/hrdm
          test ! -f CareerHub/requirements.txt
          test ! -f CareerHub/instance.yaml
          test ! -f CareerHub/stack.lock.yaml
      - name: Validate personalised design contracts against CareerHubZero
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator

          root = Path('CareerHub/personalisation')
          central = Path('.careerhub-zero/schemas')
          contracts = [
              ('hub.profile.yaml', 'personalised-hub.schema.json', 'yaml'),
              ('theme.tokens.json', 'theme-tokens.schema.json', 'json'),
              ('derivation.yaml', 'profile-derivation.schema.json', 'yaml'),
              ('profile.shell.yaml', 'profile-shell.schema.json', 'yaml'),
          ]

          for instance_name, schema_name, format_name in contracts:
              instance_path = root / instance_name
              schema_path = central / schema_name
              raw = instance_path.read_text(encoding='utf-8')
              instance = json.loads(raw) if format_name == 'json' else yaml.safe_load(raw)
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              validator = Draft202012Validator(schema)
              errors = sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path))
              if errors:
                  lines = []
                  for error in errors:
                      where = '.'.join(str(part) for part in error.absolute_path) or '<root>'
                      lines.append(f'{instance_name}:{where}: {error.message}')
                  raise SystemExit('Personalisation schema validation failed:\n' + '\n'.join(lines))
              print('SCHEMA OK', instance_name, 'against', schema_name)
          PY
      - name: Validate profile contract against central motor
        env:
          PYTHONPATH: .careerhub-zero/src
        run: python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml validate
      - name: Render profile surfaces with central motor
        env:
          PYTHONPATH: .careerhub-zero/src
        run: python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml render
      - name: Verify manifest-owned profile and state are preserved
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('CareerHub')
          manifest = yaml.safe_load((root / 'careerhub.yaml').read_text(encoding='utf-8'))
          required = [manifest['profile']['path'], manifest['search']['path'], *manifest['state'].values()]
          required += ['CONTROL_ROOM.md', 'APPLICATIONS.md', 'JOB_VAULT.md']
          missing = [rel for rel in required if not (root / rel).exists()]
          if missing:
              raise SystemExit('Missing preserved profile/state paths: ' + ', '.join(missing))
          print('Preserved profile/state paths OK:', ', '.join(required))
          PY
      - name: Reproduce central sync and re-apply Weronika visual layers
        run: |
          python .careerhub-zero/scripts/sync_web_shell.py CareerHub
          python .github/scripts/apply_weronika_visual_override.py
          test -f CareerHub/site/personal/weronika.css
          test -f CareerHub/site/personal/weronika-v3.css
          grep -F "import '../personal/weronika.css';" CareerHub/site/app/layout.tsx
          grep -F "import '../personal/weronika-v3.css';" CareerHub/site/app/layout.tsx
      - name: Build personalised site with visual override
        working-directory: CareerHub/site
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
