name: CareerHub — Drill & Application Pack

on:
  workflow_dispatch:
    inputs:
      job_url:
        description: "Public job-ad URL"
        required: true
        type: string
      lane:
        description: "Application/search lane"
        required: true
        type: choice
        options: [core, adjacent, bridge]
        default: core
      job_text:
        description: "Optional job text when the URL blocks automated retrieval"
        required: false
        type: string

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREERHUB_MODEL: ${{ secrets.CAREERHUB_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Store optional job text
        run: printf '%s' "${{ inputs.job_text }}" > /tmp/careerhub-job-text.txt
      - name: Build HRDM and application pack through CareerHubZero
        uses: Motherpher/CareerHubZero@main
        with:
          manifest: CareerHub/careerhub.yaml
          command: drill
          arguments: --url "${{ inputs.job_url }}" --text-file /tmp/careerhub-job-text.txt --lane "${{ inputs.lane }}" --out "output/run-${{ github.run_id }}"
      - name: Upload application pack
        uses: actions/upload-artifact@v4
        with:
          name: careerhub-application-${{ github.run_id }}
          path: CareerHub/output/run-${{ github.run_id }}/
          retention-days: 14
          if-no-files-found: error
