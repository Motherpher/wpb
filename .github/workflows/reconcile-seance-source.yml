name: Reconcile Séance source batch

on:
  push:
    branches:
      - research/source-reconciliation-2026-10-07-c
    paths:
      - scripts/reconcile_seance_source.py
      - .github/workflows/reconcile-seance-source.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/source-reconciliation-2026-10-07-c
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile verified source into archive and portfolio
        run: python scripts/reconcile_seance_source.py
      - name: Rebuild derived archive outputs
        run: python scripts/build_outputs.py
      - name: Commit reconciled outputs
        run: |
          if git diff --quiet; then
            echo "No reconciliation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus.json data/article-metadata.json data/dashboard.json bibliography/master-bibliography.md DASHBOARD.md visuals/dashboard.svg CareerHub/personalisation/portfolio-catalog.json CareerHub/personalisation/portfolio.yaml WriterRoom/portfolio/PRIMARY_AREA_INDEX.md docs/SOURCE_RECONCILIATION_2026-10-07.md
          git commit -m "Add verified Forumist Séance with Goat credit"
          git push origin HEAD:research/source-reconciliation-2026-10-07-c
