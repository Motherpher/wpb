name: CareerHub · Current Motor Shell Cutover

on:
  push:
    branches: [feat/current-motor-cutover]
    paths:
      - ".github/workflows/careerhub-shell-cutover.yml"

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/current-motor-cutover
          fetch-depth: 0

      - name: Checkout canonical CareerHub motor
        uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero

      - name: Install Weronika personalisation contract
        shell: bash
        run: |
          mkdir -p CareerHub/personalisation
          cat > CareerHub/personalisation/hub.profile.yaml <<'EOF'
          schema_version: "1.0"
          identity:
            display_name: "Weronika Pérez Borjas"
            strapline: "Writing, reporting and editorial work across culture, society and long-form journalism."
            language: "en"
          experience:
            mode: editorial
            density: balanced
            guidance: standard
            motion: subtle
          home:
            headline: "Current work. Current opportunities. Clear evidence."
            intro: "Use the verified profile as the starting point, adjust the search when needed, analyse the role, then build and track the application."
            slots: [identity, profile_health, search_coverage, next_action, opportunities, pipeline, hrdm, artifacts]
          navigation:
            primary: [profile, find, analyse, apply, track, library, home]
            labels:
              profile: Profile
              find: Search
              analyse: Analyse
              apply: Apply
              track: Track
              library: Library
              home: Overview
          EOF
          cat > CareerHub/personalisation/theme.tokens.json <<'EOF'
          {
            "schema_version": "1.0",
            "typography": {"display": "Georgia, 'Times New Roman', serif", "body": "ui-sans-serif, system-ui, sans-serif", "scale": "balanced"},
            "shape": {"radius": "soft", "border": "defined"},
            "surface": {"treatment": "editorial", "shadow": "none"},
            "palette": {"background": "#F5F1E8", "foreground": "#1D1A17", "muted": "#6D675F", "accent": "#7A2F3A", "accent_foreground": "#FFFFFF"}
          }
          EOF
          cat > CareerHub/personalisation/voice.yaml <<'EOF'
          schema_version: "1.0"
          posture: "editorial, precise, culturally literate, evidence-bounded"
          prefer:
            - clear editorial hierarchy
            - concrete role and publication language
            - concise guidance around next actions
          avoid:
            - generic motivational career language
            - inflated claims beyond verified sources
            - treating historical location as current residence
          EOF
          cat > CareerHub/personalisation/derivation.yaml <<'EOF'
          schema_version: "1.0"
          status: STRUCTURE_READY
          source_basis:
            - profile/candidate_verified.yaml
            - config/search_profile.yaml
          material_decisions:
            - editorial rather than analytical information posture
            - publication/reporting evidence foregrounded
            - balanced information density
            - profile-search-analysis-application-tracking journey
          evidence_rule: "Presentation changes emphasis only; it does not add career evidence."
          EOF

      - name: Align versionless manifest
        shell: bash
        run: |
          cat > CareerHub/careerhub.yaml <<'EOF'
          schema_version: "1.0"
          profile_id: weronika-perez-borjas

          profile:
            path: profile/candidate_verified.yaml
          search:
            path: config/search_profile.yaml
          state:
            job_vault: data/job_vault.json
            applications: data/applications.json
            hrdm_ledger: data/hrdm_ledger.json
          artifacts:
            hrdm_reports: reports/hrdm/active
            hrdm_history: reports/hrdm/history
          ui:
            language: en
          presentation:
            profile: personalisation/hub.profile.yaml
            theme: personalisation/theme.tokens.json
            voice: personalisation/voice.yaml
            site_root: site
          EOF

      - name: Sync canonical managed web shell
        run: python .careerhub-zero/scripts/sync_web_shell.py CareerHub

      - name: Validate profile against central motor
        env:
          PYTHONPATH: .careerhub-zero/src
        run: |
          python -m pip install -r .careerhub-zero/requirements.txt
          python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml validate

      - name: Build personalised site
        working-directory: CareerHub/site
        run: |
          npm install
          npm run build

      - name: Commit cutover output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CareerHub/careerhub.yaml CareerHub/personalisation CareerHub/site CareerHub/data/hrdm_ledger.json
          if git diff --cached --quiet; then
            echo "No cutover changes."
            exit 0
          fi
          git commit -m "Sync Weronika CareerHub to current central motor shell"
          git push origin HEAD:feat/current-motor-cutover
