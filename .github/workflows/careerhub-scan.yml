name: CareerHub — Scan & Rank Jobs

on:
  push:
    paths:
      - "CareerHub/config/**"
      - "CareerHub/profile/**"
      - "CareerHub/careerhub.yaml"
  workflow_dispatch:
    inputs:
      lane:
        description: "Search lane"
        required: true
        type: choice
        options: [all, core, adjacent, bridge]
        default: all
      limit:
        description: "Maximum ranked leads to keep"
        required: true
        default: "80"
  schedule:
    - cron: "20 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: careerhub-state-main
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      LANE: ${{ inputs.lane || 'all' }}
      LIMIT: ${{ inputs.limit || '80' }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      JOOBLE_API_ENDPOINT: ${{ secrets.JOOBLE_API_ENDPOINT }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install central CareerHub motor
        run: pip install -r .careerhub-zero/requirements.txt
      - name: Align with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Source and rank jobs
        env:
          PYTHONPATH: .careerhub-zero/src
        run: python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml scan --lane "$LANE" --limit "$LIMIT"
      - name: Commit refreshed CareerHub state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CareerHub/CONTROL_ROOM.md CareerHub/JOB_VAULT.md CareerHub/APPLICATIONS.md CareerHub/data/latest_jobs.json CareerHub/data/job_vault.json CareerHub/data/applications.json CareerHub/data/maps 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No CareerHub changes."
            exit 0
          fi
          git commit -m "CareerHub: refresh ranked job leads"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
