name: CareerHub — Scan & Rank Jobs

on:
  push:
    paths:
      - "CareerHub/config/search_profile.yaml"
      - "CareerHub/profile/candidate_verified.yaml"
  workflow_dispatch:
    inputs:
      lane:
        description: "Search lane"
        required: true
        type: choice
        options: [all, core, adjacent, bridge]
        default: all
      limit:
        description: "Maximum ranked leads to keep"
        required: true
        default: "80"
  schedule:
    - cron: "20 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: careerhub-state-main
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      LANE: ${{ inputs.lane || 'all' }}
      LIMIT: ${{ inputs.limit || '80' }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      JOOBLE_API_ENDPOINT: ${{ secrets.JOOBLE_API_ENDPOINT }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Source and rank jobs through CareerHubZero
        uses: Motherpher/CareerHubZero@main
        with:
          manifest: CareerHub/careerhub.yaml
          command: scan
          arguments: --lane "${{ env.LANE }}" --limit "${{ env.LIMIT }}"
      - name: Commit refreshed CareerHub state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CareerHub/data CareerHub/CONTROL_ROOM.md CareerHub/JOB_VAULT.md CareerHub/APPLICATIONS.md CareerHub/reports
          if git diff --cached --quiet; then
            echo "No CareerHub changes."
            exit 0
          fi
          git commit -m "CareerHub: refresh ranked job leads"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
