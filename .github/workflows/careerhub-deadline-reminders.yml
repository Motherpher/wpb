name: CareerHub — Deadline Reminders

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: careerhub-state-main
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CAREERHUB_NOTIFY_EMAIL: ${{ secrets.CAREERHUB_NOTIFY_EMAIL }}
      CAREERHUB_NOTIFY_EMAIL_FROM: ${{ secrets.CAREERHUB_NOTIFY_EMAIL_FROM }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      CAREERHUB_NOTIFY_PHONE: ${{ secrets.CAREERHUB_NOTIFY_PHONE }}
      CAREERHUB_APPLICATIONS: CareerHub/data/applications.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout central CareerHub utilities
        uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - name: Install central dependencies
        run: python -m pip install -r .careerhub-zero/requirements.txt
      - name: Send due reminders
        run: python .careerhub-zero/scripts/deadline_notify.py
      - name: Persist reminder log
        run: |
          if git diff --quiet -- CareerHub/data/applications.json; then
            echo "No reminder state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CareerHub/data/applications.json
          git commit -m "CareerHub: record deadline reminders"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
