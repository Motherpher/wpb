name: CareerHub — Choose Job & Prepare Pack

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: careerhub-state-main
  cancel-in-progress: false

jobs:
  choose:
    if: >-
      (startsWith(github.event.issue.title, '[CareerHub Job]') ||
       startsWith(github.event.issue.title, '[CareerHub Drill]')) &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREERHUB_MODEL: ${{ secrets.CAREERHUB_MODEL }}
      CAREERHUB_REQUIRE_AI: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout central CareerHub motor
        uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - name: Install central dependencies
        run: python -m pip install -r .careerhub-zero/requirements.txt
      - name: Read chosen-job request
        run: |
          mkdir -p /tmp/careerhub-request
          python .careerhub-zero/scripts/issue_request.py --event "$GITHUB_EVENT_PATH" --out /tmp/careerhub-request
      - name: Verify OpenAI is configured
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::CareerHub cannot run HRDM because OPENAI_API_KEY is missing."
            exit 1
          fi
      - name: Build HRDM and application pack
        env:
          PYTHONPATH: .careerhub-zero/src
        run: |
          JOB_URL="$(cat /tmp/careerhub-request/job_url.txt)"
          LANE="$(cat /tmp/careerhub-request/lane.txt)"
          ROLE="$(cat /tmp/careerhub-request/role.txt)"
          EMPLOYER="$(cat /tmp/careerhub-request/employer.txt)"
          DEADLINE="$(cat /tmp/careerhub-request/deadline.txt)"
          OUT="output/issue-${{ github.event.issue.number }}"
          python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml drill --url "$JOB_URL" --text-file /tmp/careerhub-request/job_text.txt --title "$ROLE" --company "$EMPLOYER" --deadline "$DEADLINE" --lane "$LANE" --out "$OUT" --issue-number "${{ github.event.issue.number }}"
          cp /tmp/careerhub-request/request.json "CareerHub/$OUT/request.json"
      - name: Register chosen job
        env:
          PYTHONPATH: .careerhub-zero/src
        run: |
          PRIORITY="$(cat /tmp/careerhub-request/priority.txt)"
          python .careerhub-zero/scripts/careerhub.py --manifest CareerHub/careerhub.yaml track --action choose --job-json "CareerHub/output/issue-${{ github.event.issue.number }}/job.json" --issue-number "${{ github.event.issue.number }}" --issue-url "${{ github.event.issue.html_url }}" --priority "$PRIORITY" --analysis-complete
      - name: Commit CareerHub state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CareerHub/data CareerHub/reports CareerHub/CONTROL_ROOM.md CareerHub/APPLICATIONS.md CareerHub/JOB_VAULT.md
          if ! git diff --cached --quiet; then
            git commit -m "CareerHub: choose job #${{ github.event.issue.number }}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload finished pack
        uses: actions/upload-artifact@v4
        with:
          name: CareerHub-${{ github.event.issue.number }}-application-pack
          path: CareerHub/output/issue-${{ github.event.issue.number }}/
          retention-days: 14
          if-no-files-found: error
      - name: Tell the user the pack is ready
        if: success()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "CareerHub analysis and application pack are ready: $RUN_URL"
