name: CareerHub — Test OpenAI Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREERHUB_MODEL: ${{ secrets.CAREERHUB_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout central CareerHub motor
        uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - name: Install central dependencies
        run: python -m pip install -r .careerhub-zero/requirements.txt
      - name: Check secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "## ❌ CareerHub is not connected to OpenAI" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository secret **OPENAI_API_KEY** is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Test OpenAI Responses API
        run: |
          python .careerhub-zero/scripts/test_openai.py
          echo "## ✅ CareerHub is connected to OpenAI" >> "$GITHUB_STEP_SUMMARY"
          echo "A live Responses API request succeeded through the central CareerHub motor." >> "$GITHUB_STEP_SUMMARY"
