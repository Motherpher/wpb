name: CareerHub — Test OpenAI Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREERHUB_MODEL: ${{ secrets.CAREERHUB_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install central CareerHub dependencies
        run: pip install -r .careerhub-zero/requirements.txt
      - name: Check secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "## ❌ CareerHub is not connected to OpenAI" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository secret **OPENAI_API_KEY** is missing." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::OPENAI_API_KEY is missing."
            exit 1
          fi
      - name: Test OpenAI Responses API
        run: |
          python .careerhub-zero/scripts/test_openai.py
          echo "## ✅ CareerHub is connected to OpenAI" >> "$GITHUB_STEP_SUMMARY"
          echo "The central CareerHub motor completed a live Responses API test." >> "$GITHUB_STEP_SUMMARY"
      - name: Troubleshooting
        if: failure()
        run: |
          echo "### If the secret exists but the test failed" >> "$GITHUB_STEP_SUMMARY"
          echo "- confirm API billing/credits are active" >> "$GITHUB_STEP_SUMMARY"
          echo "- confirm the key belongs to the intended OpenAI project" >> "$GITHUB_STEP_SUMMARY"
          echo "- confirm the configured model is available" >> "$GITHUB_STEP_SUMMARY"
