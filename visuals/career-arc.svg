<text x="70" y="78" class="title">From body to systems</text>
<text x="70" y="112" class="sub">Analytical career arc reconstructed from the corpus — overlapping phases, not self-declared labels</text>
<rect x="70" y="230" width="245" height="180" rx="10" fill="#B55236"/><text x="92" y="268" class="phaseNum">1</text><text x="92" y="305" class="phaseTitle">Body &amp; fashion research</text><text x="92" y="336" class="phaseSub">2012–2014 · 2 works</text><text x="92" y="370" class="phaseTxt">Anatomy · fashion · representation</text><path d="M 315 320 L 350 375" stroke="#191919" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="350" y="285" width="245" height="180" rx="10" fill="#365E73"/><text x="372" y="323" class="phaseNum">2</text><text x="372" y="360" class="phaseTitle">Cultural journalism</text><text x="372" y="391" class="phaseSub">2014–2017 · 21 works</text><text x="372" y="425" class="phaseTxt">Music · art · city · diaspora</text><path d="M 595 375 L 630 430" stroke="#191919" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="630" y="340" width="245" height="180" rx="10" fill="#B55236"/><text x="652" y="378" class="phaseNum">3</text><text x="652" y="415" class="phaseTitle">Social-observational reporting</text><text x="652" y="446" class="phaseSub">2016 · 10 works</text><text x="652" y="480" class="phaseTxt">Migration · race · gender · everyday norms</text><path d="M 875 430 L 910 485" stroke="#191919" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="910" y="395" width="245" height="180" rx="10" fill="#365E73"/><text x="932" y="433" class="phaseNum">4</text><text x="932" y="470" class="phaseTitle">Long-form social reportage</text><text x="932" y="501" class="phaseSub">2018–2020 · 5 works</text><text x="932" y="535" class="phaseTxt">Institutions · rights · borders · labour</text>
<text x="70" y="700" class="sub">Body → identity → classification → institution → rights / mobility / access</text>
