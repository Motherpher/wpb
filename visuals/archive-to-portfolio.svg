<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="740" viewBox="0 0 1300 740">
<style>
.title{font:700 38px Arial,sans-serif;fill:#191919}.sub{font:18px Arial,sans-serif;fill:#68645D}
